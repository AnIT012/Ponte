name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pytest を入れる（言語そのものは標準機能だけ）
        run: pip install pytest
      - name: テスト
        run: python -m pytest -q
      - name: 見本のアプリ（穴も失敗に）
        run: |
          for f in spec/todo.ponte spec/lend.ponte spec/kakeibo.ponte spec/hub_app.ponte; do
            python -m ponte check "$f" && python -m ponte test "$f" --strict || exit 1
          done
      - name: 仕様書の道具の表が実装とずれていない
        run: |
          python -m ponte guide --spec
          git diff --exit-code docs/
