[project]
name = "ponte"
version = "0.3.1"
description = "Ponte：決めるのは人。守るのは言語。"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ponte = "ponte.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ponte*"]

[tool.setuptools.package-data]
ponte = ["page.html", "std/*.ponte", "std/body/*.ponte", "templates/*.ponte"]
